!
hostname CC-A
ip routing
!
vrf definition GESTION
 address-family ipv4
 exit-address-family
!
vrf definition IT
 address-family ipv4
 exit-address-family
!
vrf definition INVITES
 address-family ipv4
 exit-address-family
!
vrf definition OT
 address-family ipv4
 exit-address-family
!
interface Loopback0
 ip address 10.42.1.1 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet0/0
 description To CC-B - inter-building fiber
 no switchport
 ip address 10.42.2.0 255.255.255.254
 ip ospf network point-to-point
 ip ospf message-digest-key 1 md5 <OSPF-KEY>
 ip ospf 1 area 0
 no shutdown
!
router ospf 1
 router-id 10.42.1.1
 auto-cost reference-bandwidth 100000
 passive-interface default
 no passive-interface GigabitEthernet0/0
 area 0 authentication message-digest
!
interface GigabitEthernet0/1
 description 802.1Q trunk to FW-A
 no ip address
 no shutdown
!
interface GigabitEthernet0/1.2010
 description To FW-A - GESTION
 encapsulation dot1Q 2010
 vrf forwarding GESTION
 ip address 10.42.2.2 255.255.255.254
!
interface GigabitEthernet0/1.2020
 description To FW-A - IT
 encapsulation dot1Q 2020
 vrf forwarding IT
 ip address 10.42.2.4 255.255.255.254
!
interface GigabitEthernet0/1.2040
 description To FW-A - INVITES
 encapsulation dot1Q 2040
 vrf forwarding INVITES
 ip address 10.42.2.6 255.255.255.254
!
interface GigabitEthernet0/1.2050
 description To FW-A - OT
 encapsulation dot1Q 2050
 vrf forwarding OT
 ip address 10.42.2.8 255.255.255.254
!
interface Vlan10
 description Management - GESTION
 vrf forwarding GESTION
 ip address 10.42.0.2 255.255.255.0
 vrrp 10 ip 10.42.0.1
 vrrp 10 priority 120
!
interface Vlan20
 description Office IT
 vrf forwarding IT
 ip address 10.42.16.2 255.255.255.0
 vrrp 20 ip 10.42.16.1
 vrrp 20 priority 120
!
interface Vlan21
 description IT subnet 21
 vrf forwarding IT
 ip address 10.42.17.2 255.255.255.0
 vrrp 21 ip 10.42.17.1
!
interface Vlan25
 description ERP server network
 vrf forwarding IT
 ip address 10.42.18.2 255.255.255.0
 vrrp 25 ip 10.42.18.1
 vrrp 25 priority 120
!
interface Vlan30
 description IT Voice A
 vrf forwarding IT
 ip address 10.42.32.2 255.255.255.0
 vrrp 30 ip 10.42.32.1
 vrrp 30 priority 120
!
interface Vlan31
 description IT Voice B
 vrf forwarding IT
 ip address 10.42.33.2 255.255.255.0
 vrrp 31 ip 10.42.33.1
!
interface Vlan40
 description Guest network - INVITES
 vrf forwarding INVITES
 ip address 10.42.48.2 255.255.254.0
 vrrp 40 ip 10.42.48.1
 vrrp 40 priority 120
!
interface Vlan50
 description PLCs - building A
 vrf forwarding OT
 ip address 10.42.64.2 255.255.255.0
 vrrp 50 ip 10.42.64.1
!
interface Vlan51
 description Production supervision
 vrf forwarding OT
 ip address 10.42.65.2 255.255.255.0
 vrrp 51 ip 10.42.65.1
!
ip route vrf GESTION 0.0.0.0 0.0.0.0 10.42.2.3
ip route vrf IT 0.0.0.0 0.0.0.0 10.42.2.5
ip route vrf INVITES 0.0.0.0 0.0.0.0 10.42.2.7
ip route vrf OT 0.0.0.0 0.0.0.0 10.42.2.9
!
aaa new-model
aaa authentication login DEFAUT group radius local
aaa authorization exec DEFAUT group radius local
aaa accounting exec DEFAUT start-stop group radius
!
radius server ATLAS
 address ipv4 10.42.18.12 auth-port 1812 acct-port 1813
 key <RADIUS-KEY>
!
ip radius source-interface Vlan10
username secours privilege 15 secret <LOCAL-SECRET>
ip domain-name atlas.local
ip ssh version 2
!
ip access-list standard ADMIN
 permit 10.42.18.20
 permit 10.42.18.21
 deny any log
!
line vty 0 4
 transport input ssh
 access-class ADMIN in
 login authentication DEFAUT
 exec-timeout 10 0
!
no ip http-server
no ip http-secure-server
!
snmp-server group GRP-ATLAS v3 priv 
snmp-server user superviseur GRP-ATLAS v3 auth sha <auth-key> priv aes 128 <priv-key> 
! 
ntp server vrf GESTION 10.42.18.10 
logging host 10.42.18.11 vrf GESTION 
service timestamps log datetime msec localtime show-timezone
end
