!
hostname ACC-A-01
!
aaa new-model
aaa authentication login DEFAUT group radius local
aaa authorization exec DEFAUT group radius local
aaa accounting exec DEFAUT start-stop group radius
!
radius server ATLAS
 address ipv4 10.42.18.12 auth-port 1812 acct-port 1813
 key <RADIUS-KEY>
!
ip radius source-interface Vlan10
!
username secours privilege 15 secret <LOCAL-SECRET>
!
ip domain-name atlas.local
crypto key generate rsa modulus 2048
ip ssh version 2
!
ip access-list standard ADMIN
 permit 10.42.18.20
 permit 10.42.18.21
 deny any log
!
line vty 0 4
 transport input ssh
 access-class ADMIN in
 login authentication DEFAUT
 exec-timeout 10 0
!
no ip http-server
no ip http-secure-server
!
snmp-server group GRP-ATLAS v3 priv 
snmp-server user superviseur GRP-ATLAS v3 auth sha <auth-key> priv aes 128 
<priv-key> 
! 
ntp server vrf GESTION 10.42.18.10
logging host 10.42.18.11 vrf GESTION
service timestamps log datetime msec localtime show-timezone
!
ip dhcp snooping
ip dhcp snooping vlan 20,21,25,30,31,40,50,51
ip arp inspection vlan 20,21,25
!
interface GigabitEthernet0/1
 description Uplink to CC-A
 ip dhcp snooping trust
 ip arp inspection trust
!
interface range GigabitEthernet0/2 - 19
 switchport mode access
 switchport access vlan 20
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 spanning-tree bpduguard enable
 storm-control broadcast level 1.00
!
interface range GigabitEthernet0/20 - 24
 description Unused port
 switchport access vlan 99
 shutdown
end
